[build-system]
requires = [
  "setuptools==68.0.0; python_version < '3.8'",
  "setuptools==75.3.2; python_version == '3.8'",
  "setuptools==80.9.0; python_version == '3.9'",
  "setuptools==84.0.0; python_version >= '3.10'",
  "wheel==0.42.0; python_version < '3.8'",
  "wheel==0.45.1; python_version == '3.8'",
  "wheel==0.48.0; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "tansr-sdk"
version = "0.1.0"
description = "Native Python client SDK for the Tansr Serve unified API"
readme = "README.md"
requires-python = ">=3.7,!=3.9.0,!=3.9.1"
license = {file = "LICENSE"}
authors = [{name = "Tansr"}]
dependencies = [
  "cryptography==45.0.7; python_version < '3.8'",
  "cffi==1.15.1; python_version < '3.8'",
  "pycparser==2.21; python_version < '3.8'",
  "cryptography==47.0.0; python_version >= '3.8' and python_version < '3.9'",
  "cryptography==50.0.2; python_version >= '3.9'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.tansr.com/"
Repository = "https://github.com/tansrai/tansr-python"
Documentation = "https://github.com/tansrai/tansr-python/blob/main/doc/guide.md"
Issues = "https://github.com/tansrai/tansr-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tansr_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py37"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/tansr_sdk"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
